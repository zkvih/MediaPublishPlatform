worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    upstream mpp_frontend {
        server frontend:80;
    }

    upstream mpp_backend {
        server backend:5409;
    }

    server {
        listen 5409;
        server_name _;

        client_max_body_size 2048m;

        location = /login {
            proxy_pass http://mpp_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 86400;
            proxy_set_header Connection "";
        }

        location ~ ^/(upload|getFile|uploadSave|getFiles|deleteFile|getFileStats|getPlatformStats|updateUserinfo|getAccounts|getValidAccounts|uploadCookie|downloadCookie|getPlatformHomepage|deleteAccount|getPublishTaskRecords|updatePublishTaskStatus|retryPublishTask|cancelPublishTask|deletePublishTask|postVideo|postVideosToMultiplePlatforms)$ {
            proxy_pass http://mpp_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
        }

        location / {
            proxy_pass http://mpp_frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
        }
    }
}
